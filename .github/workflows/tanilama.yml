name: Koza TV Sunucu Tanılama

# Yalnız elle çalıştırılır. Sunucuda hiçbir şey değiştirmez; sadece disk, bellek ve
# sürüm klasörlerinin durumunu okur. Dağıtım akışına dokunmaz.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durum:
    name: Disk ve bellek durumu
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7

      - name: SSH anahtarını hazırla
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          cp deployment/hetzner/known_hosts ~/.ssh/known_hosts
          chmod 0644 ~/.ssh/known_hosts

      - name: Salt okunur durum raporu
        run: |
          ssh koza-deploy@${{ vars.KOZA_HOST || '46.225.169.52' }} '
            echo "===== MAKINE ====="
            nproc --all 2>/dev/null | sed "s/^/cekirdek: /"
            grep -E "MemTotal|SwapTotal" /proc/meminfo
            uptime
            echo
            echo "===== BELLEK (MB) ====="
            free -m
            echo
            echo "===== DISK ====="
            df -h / /srv/kozatv 2>/dev/null
            echo
            echo "===== /srv/kozatv DAGILIMI ====="
            du -sh /srv/kozatv 2>/dev/null
            du -sh /srv/kozatv/releases /srv/kozatv/data /srv/kozatv/backups /srv/kozatv/incoming 2>/dev/null
            echo
            echo "===== SURUM KLASORLERI ====="
            du -sh /srv/kozatv/releases/* 2>/dev/null | sort -h
            echo "aktif surum: $(readlink -f /srv/kozatv/current 2>/dev/null)"
            echo
            echo "===== YARIM KALAN AKTARIMLAR ====="
            ls -1 /srv/kozatv/incoming 2>/dev/null || echo "yok"
            echo
            echo "===== YEDEK KLASORU ====="
            ls -la /srv/kozatv/backups 2>&1 | head -10
            echo "--- daily ---"
            ls -1t /srv/kozatv/backups/daily 2>&1 | head -5
            echo "--- weekly ---"
            ls -1t /srv/kozatv/backups/weekly 2>&1 | head -3
            echo
            echo "===== ZAMANLAYICILAR ====="
            systemctl list-timers --all 2>&1 | grep -i kozatv || echo "timer okunamadi"
            echo
            echo "===== SERVIS DURUMLARI ====="
            for u in kozatv.service kozatv-backup.timer kozatv-backup.service kozatv-health.timer; do
              printf "%-26s %s / %s\n" "$u" "$(systemctl is-enabled $u 2>&1)" "$(systemctl is-active $u 2>&1)"
            done
            echo
            echo "===== SON YEDEK CALISMASI ====="
            systemctl show kozatv-backup.service -p ExecMainStatus -p ExecMainExitTimestamp -p Result 2>&1 | head -5
            echo
            echo "===== BELLEK YETERSIZLIGI (OOM) IZI ====="
            (journalctl -k --since "-3 days" 2>/dev/null | grep -ci "out of memory\|oom-kill" || echo "0") | tail -1
            (dmesg 2>/dev/null | grep -ci "out of memory\|oom-kill" || echo "dmesg okunamadi") | tail -1
          '
