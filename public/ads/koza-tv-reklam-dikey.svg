<svg xmlns="http://www.w3.org/2000/svg" width="600" height="520" viewBox="0 0 600 520" role="img" aria-labelledby="title desc">
  <title id="title">Koza TV reklam alanı</title>
  <desc id="desc">Koza TV kurumsal renkleriyle hazırlanmış örnek reklam görseli.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79030a"/>
      <stop offset="0.48" stop-color="#d20d18"/>
      <stop offset="1" stop-color="#ff2933"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="18%" r="68%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#3a0004" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="600" height="520" rx="24" fill="url(#bg)"/>
  <rect width="600" height="520" rx="24" fill="url(#glow)"/>
  <circle cx="502" cy="430" r="176" fill="none" stroke="#fff" stroke-opacity=".09" stroke-width="54"/>
  <path d="M36 44h528" stroke="#fff" stroke-opacity=".38" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="54" y="78" width="492" height="122" rx="12" fill="#0d151e"/>
    <text x="300" y="158" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="76" font-weight="900" text-anchor="middle" letter-spacing="8">KOZA TV</text>
  </g>
  <text x="300" y="278" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="62" font-weight="900" text-anchor="middle">REKLAM</text>
  <text x="300" y="335" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" text-anchor="middle" letter-spacing="8">ALANI</text>
  <rect x="128" y="378" width="344" height="70" rx="35" fill="#fff"/>
  <text x="300" y="423" fill="#b40a13" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="900" text-anchor="middle" letter-spacing="2">MARKANIZ BURADA</text>
  <text x="300" y="489" fill="#fff" fill-opacity=".82" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="3">ŞİMDİ KONUŞMA ZAMANI</text>
</svg>
